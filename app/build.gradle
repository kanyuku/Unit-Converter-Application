plugins {
    id "com.android.application"
}

def uploadStoreFile = providers.environmentVariable("UNIT_CONVERTER_UPLOAD_STORE_FILE").orNull
def uploadStorePassword = providers.environmentVariable("UNIT_CONVERTER_UPLOAD_STORE_PASSWORD").orNull
def uploadKeyAlias = providers.environmentVariable("UNIT_CONVERTER_UPLOAD_KEY_ALIAS").orNull
def uploadKeyPassword = providers.environmentVariable("UNIT_CONVERTER_UPLOAD_KEY_PASSWORD").orNull
def hasAnyUploadSigningValue = [
        uploadStoreFile,
        uploadStorePassword,
        uploadKeyAlias,
        uploadKeyPassword
].any { it != null }
def hasCompleteUploadSigningValues = [
        uploadStoreFile,
        uploadStorePassword,
        uploadKeyAlias,
        uploadKeyPassword
].every { it != null && !it.isBlank() }

android {
    namespace "com.example.unitconverter"
    compileSdk 36

    defaultConfig {
        applicationId "com.example.unitconverter"
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        release {
            if (hasCompleteUploadSigningValues) {
                storeFile file(uploadStoreFile)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasCompleteUploadSigningValues) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

if (hasAnyUploadSigningValue && !hasCompleteUploadSigningValues) {
    throw new GradleException("Upload signing is partially configured. Set all UNIT_CONVERTER_UPLOAD_* environment variables.")
}

if (gradle.startParameter.taskNames.any { it.toLowerCase(Locale.ROOT).contains("release") }
        && !hasCompleteUploadSigningValues) {
    throw new GradleException("Release signing is not configured. See docs/PLAY_STORE_RELEASE.md.")
}

if (hasCompleteUploadSigningValues && !file(uploadStoreFile).isFile()) {
    throw new GradleException("The upload keystore file configured by UNIT_CONVERTER_UPLOAD_STORE_FILE does not exist.")
}
